# Courses in the order taken. Drives coursework.qmd (one listing per semester).
#   reference  per-course Quarto reference summary (relative path in this repo)
#   syllabus   absolute github.com blob URL (GitHub Pages 403s on directory paths)
#   summary    may contain inline HTML (<em>, <code>)
# Note: SURV 772 is the UMD code for the UMich design seminar; its folder is
#       design_seminar_SURV670.
- semester: Fall 2024
  code: SURV 615
  title: Statistical Methods and Machine Learning I
  reference: courses/stat_mod_ML_1_SURV615/SURV615_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/stat_mod_ML_1_SURV615/syllabus.pdf
  summary: First course in a three-term sequence in applied statistical methods and machine
    learning for complex datasets. Covers linear model theory and regression as the basis
    for handling survey and observational data, with emphasis on the proper application of
    techniques (model assumptions, diagnostics, interpretation) rather than derivation of
    theoretical properties. Implemented in R using Faraway and James, Witten, Hastie, and
    Tibshirani as core texts.
- semester: Fall 2024
  code: SURV 621
  title: Fundamentals of Data Collection I
  reference: courses/fund_data_coll_1_SURV621/SURV621_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/fund_data_coll_1_SURV621/syllabus.pdf
  summary: First semester of a two-semester sequence on the processes that generate data,
    both designed (primarily survey data) and found (administrative records, smartphone sensor
    data, social media). Introduces the Total Survey Error framework and its extension to
    found data, then works through coverage error, nonresponse error, sources of measurement
    error in questionnaire writing, and modes of data collection from classic (mail, face-to-face,
    telephone, web) to emerging (text/SMS, video) and mixed-mode designs.
- semester: Fall 2024
  code: SURV 632
  title: Cognition, Communication, and Survey Measurement
  reference: courses/cog_comm_surv_measurement_SURV632/SURV632_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/cog_comm_surv_measurement_SURV632/syllabus.pdf
  summary: 'Covers major sources of survey measurement error from the perspective of the social
    sciences, particularly cognitive psychology. The first part of the course follows the
    sequence of cognitive processes a respondent carries out to produce an answer — comprehension,
    retrieval, judgment, response — and the errors that arise at each stage (misunderstanding
    questions, forgetting relevant information, imprecise estimation, question and response
    order effects). The second part covers special topics: classification and coding, technology-mediated
    responding, survey satisficing, and cross-cultural survey research.'
- semester: Fall 2024
  code: SURV 727
  title: Fundamentals of Computing and Data Display
  reference: courses/fund_comp_data_display_SURV727/SURV727_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/fund_comp_data_display_SURV727/syllabus.pdf
  summary: A computational methods course for empirical social scientists working with data
    that extends beyond structured, ready-to-handle survey data. The first half covers web
    scraping and APIs for gathering data from the web and storing and managing data from diverse
    sources efficiently; the second half covers techniques for exploring and finding patterns
    in non-standard data with a focus on data visualization. Built around R, with excursions
    into SQL and big-data processing tools, and uses Git and GitHub for reproducible, collaborative
    research.
- semester: Spring 2025
  code: SURV 613
  title: Machine Learning for Social Science
  reference: courses/ML_social_science_SURV613/SURV613_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/ML_social_science_SURV613/syllabus.pdf
  summary: An introduction to supervised statistical learning techniques — decision trees,
    random forests, boosting, and related methods — and their potential applications in the
    social sciences. Where traditional regression focuses on causation, predictive methods
    focus on learning a function f(X) that predicts an outcome Y, opening different research
    perspectives and providing a valuable extension to empirical social scientists' toolkits
    as new data sources become more prominent. Covers the full ML workflow (data preparation,
    model building, validation, testing), the bias-variance tradeoff, and evaluation by both
    performance metrics and fairness measures.
- semester: Spring 2025
  code: SURV 616
  title: Statistical Methods and Machine Learning II
  reference: courses/stat_mod_ML_2_SURV616/SURV616_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/stat_mod_ML_2_SURV616/syllabus.pdf
  summary: Second course in the three-term applied statistics sequence, building on SURV 615
    by introducing methods for categorical data and classification problems — predicting binary
    outcomes, classifying cases, and reasoning about how various perspectives can be applied
    to the same data analysis problem. Emphasis on comprehending the techniques and their
    assumptions rather than deriving their theoretical properties, applied through weekly
    homework, a paper, and a final exam.
- semester: Spring 2025
  code: SURV 622
  title: Fundamentals of Data Collection II
  reference: courses/Fund_data_collection_SURV622/SURV622_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/Fund_data_collection_SURV622/syllabus.pdf
  summary: Second semester of the two-semester data-collection sequence, reversing the focus
    from designed to found data. Covers data augmentation across sources, repurposed data
    with an emphasis on linkage to administrative records and extraction from online sources,
    text classification (turning written documents into usable data, including machine-learning
    techniques for automated coding of open responses), special issues in longitudinal data,
    and methods for evaluating the quality of survey and non-survey data.
- semester: Spring 2025
  code: SURV 625
  title: Applied Sampling
  reference: courses/applied_sampling_SURV625/SURV625_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/applied_sampling_SURV625/syllabus.pdf
  summary: An applied statistical methods course concerned almost exclusively with the design
    of data collection through probability sampling. Covers the main techniques used in sampling
    practice — simple random sampling, stratification, systematic selection, cluster sampling,
    probability proportional to size, and multistage sampling — along with sampling cost models,
    sampling error estimation, non-sampling errors, missing data, and nonprobability samples.
    Focuses on competency in computing and reasoning about sampling variances for means and
    proportions under each technique.
- semester: Fall 2025
  code: SURV 617
  title: Applications of Statistical Modeling
  reference: courses/applications_stats_modeling_SURV617/SURV617_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/applications_stats_modeling_SURV617/syllabus.pdf
  summary: 'Required for all three tracks of the JPSM and MPSDS programs, this course covers
    applications of more advanced statistical modeling tools for substantive and methodological
    investigations: multilevel and marginal modeling for clustered or longitudinal data (with
    applications to interviewer effects and to trend modeling in the Health and Retirement
    Study), structural equation modeling (with latent class models applied to measurement-error
    studies), and machine learning algorithms (with an application to response propensity
    prediction). Each technique is supplemented with methods for handling complex sample designs
    when fitting models.'
- semester: Fall 2025
  code: SURV 626
  title: Sampling I
  reference: courses/sampling_1_SURV626/SURV626_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/sampling_1_SURV626/syllabus.pdf
  summary: An applied statistics methods course concerned with the design of data collection
    rather than the analysis of collected data, focused on the particular problems of sampling
    human populations. Covers the basic ideas, concepts, and principles of probability sampling
    from an applied perspective; identification and appropriate application of sampling techniques
    to survey design problems; sample-size calculation for a variety of designs; the impact
    of sample design on survey estimates; and precision estimation using different techniques.
- semester: Fall 2025
  code: SURV 720
  title: Total Survey Error and Data Quality I
  reference: courses/total_survey_error_SURV720/SURV720_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/total_survey_error_SURV720/syllabus.pdf
  summary: A focused treatment of the major sources of error in estimates derived from survey
    data, excluding random sampling error. Covers coverage error (failure to give every member
    of the population a chance of selection), nonresponse error (failure to collect data on
    all sampled cases), measurement error (failure of recorded responses to reflect respondents'
    true characteristics), and editing, processing, and analysis errors, along with errors
    specific to newer data sources. Examines the interplay of errors and costs in survey designs
    and the tradeoffs that arise when reducing one source can increase another.
- semester: Fall 2025
  code: SURV 740
  title: Fundamentals of Inference
  reference: courses/Fund_Infe_SURV740/SURV740_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/Fund_Infe_SURV740/syllabus.pdf
  summary: One of the three fundamental courses required by all students in the JPSM and MPSDS
    master's programs. Focused on the fundamentals of statistical inference in the finite
    population setting — the foundational theory that distinguishes survey statistics from
    standard inferential statistics, and the basis on which design-based methods for variance
    estimation and inference under complex sample designs are built.
- semester: Fall 2025
  code: SURV 752
  title: Introduction to Data Visualization
  reference: courses/Data_visualization_SURV752/SURV752_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/Data_visualization_SURV752/syllabus.pdf
  summary: A short, intensive course on data visualization as a methodology for social science
    analysis rather than simply turning data into visual objects. Covers principles of analytic
    design and graphical perception, the distinction between high-level goals (exploration
    vs. presentation) and low-level goals (specific comparisons, revealing specific patterns),
    and the comparative merits of familiar formats — bar, dot, and line charts — alongside
    less well-known formats such as slope graphs, sparklines, bullet graphs, and small multiples.
    Implemented in R.
- semester: Spring 2026
  code: SURV 701
  title: Analysis of Complex Sample Survey Data
  reference: courses/complex_sample_data_SURV701/SURV701_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/complex_sample_data_SURV701/syllabus.pdf
  summary: An introduction to the statistical procedures developed for the analysis of complex
    sample survey data. Covers selection and compensatory weights, the effects of stratification
    and clustering on estimation and inference, alternative variance estimation procedures
    (Taylor series linearization and replication-based methods including JRR and BRR), methods
    and software that take complex sample designs into account, and methods for handling missing
    data through weighting adjustment and imputation. Built around West, Heeringa, and Berglund's
    <em>Applied Survey Data Analysis</em>.
- semester: Spring 2026
  code: SURV 721
  title: Total Survey Error and Data Quality II
  reference: courses/total_survey_error_II_SURV721/SURV721_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/total_survey_error_II_SURV721/syllabus.pdf
  summary: A research-and-writing companion to SURV 720. Where the first term reviewed the
    existing research on total survey error, the second term gives students the opportunity
    to plan methodological research, conduct analysis on a specific form of survey error or
    data quality, and write a journal-article-style paper. The instructors take on the role
    of reviewers, with the explicit goal that final papers meet the standards of journals
    such as <em>Public Opinion Quarterly</em>, the <em>Journal of Official Statistics</em>,
    and the <em>Journal of Survey Statistics and Methodology</em>.
- semester: Spring 2026
  code: SURV 745
  title: Practical Tools for Study Design and Inference
  reference: courses/PracTools_SURV745/SURV745_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/PracTools_SURV745/syllabus.pdf
  summary: A hands-on sampling-statistics course for second-year master's and doctoral students,
    combining applications with a review of the theory behind different approaches to sampling
    and weighting. Topics include sample-size calculation using relative standard error, margin
    of error, and power; mathematical programming for sample-size optimization across multiple
    subgroups; resources for area probability sample design; sample allocation in multistage
    designs; base weights, nonresponse adjustments, and auxiliary-data uses; nonresponse adjustment
    via weighting cells, regression-tree cells, and propensity scores; calibration via poststratification,
    raking, and general regression estimation; and weighting for nonprobability samples. Implemented
    in R (<code>PracTools</code>, <code>survey</code>, <code>tidycensus</code>) and Excel.
- semester: Spring 2026
  code: SURV 751
  title: Introduction to Machine Learning and Big Data
  reference: courses/intro_ML_big_data_SURV751/SURV751_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/intro_ML_big_data_SURV751/syllabus.pdf
  summary: A focused introduction to how Big Data concepts and machine-learning methods are
    used in the context of survey research. Covers Big Data terminology and common data-generating
    processes; primary issues in linking Big Data with survey data; coverage and measurement
    error in the Big Data context; inference versus prediction; general ML concepts, signal
    detection, and information extraction; and key analytic techniques (classification trees,
    random forests, conditional forests) applied to Big Data problems. Implemented in R with
    example code, illustrated with survey-research examples including tailored survey designs
    and nonresponse adjustment evaluation.
- semester: Spring 2026
  code: SURV 772
  title: Survey Design Seminar
  reference: courses/design_seminar_SURV670/SURV670_reference.html
  syllabus: https://github.com/klinares/klinares.github.io/blob/main/courses/design_seminar_SURV670/syllabus.pdf
  summary: A practical training element preparing students to work with real-world clients
    on methodological problems, with instruction in consulting skills, professional presentations,
    developing research proposals in response to requests for proposals, and professional
    conduct in survey design, data collection, analysis, and data science. Includes student
    and client presentation sessions in which teams present solutions to design issues raised
    by external sponsors, with readings drawn from literatures not covered in other classes
    and practical consulting problems addressed directly.
