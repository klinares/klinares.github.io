# ---- Modeling, ML & visualization -----------------------------------------

- group: modeling
  title: "Predicting MMR Vaccine Dropout in Afghan Children"
  repo: https://github.com/klinares/MMR_dropout_XGBoost
  summary: >-
    Supervised classification on the 2023 UNICEF MICS to predict measles vaccination
    dropout, enriching complex-survey microdata with administrative indicators.
  facts: "5 algorithms · 10-fold CV  ·  best F1 = 0.722, AUC = 0.633 (neural network)"
  detail: >-
    Benchmarks logistic regression, bagging, random forest, a neural network and XGBoost
    in a tidymodels pipeline with an 80/20 split and F1-optimized tuning. Provincial
    population density and household characteristics emerge as key predictors.
  tags:
    - {label: "R / tidymodels", kind: r}
    - {label: "XGBoost", kind: ml}
    - {label: "MICS Cluster Survey", kind: survey}
    - {label: "Classification", kind: stat}
    - {label: "Quarto", kind: quarto}

- group: modeling
  title: "Player Market Value in Elite European Football"
  repo: https://github.com/klinares/Moneyball_FC
  summary: >-
    A cross-classified multilevel model treating players and clubs as crossed random
    effects, the same structure as respondents who move between clusters in a panel.
  facts: "7,023 player-seasons · 2,159 players · 21 clubs · 2013–2024"
  detail: >-
    Cubic time terms centered on 2020 isolate the COVID-era correction; fit in lme4 via
    REML (BOBYQA) with Satterthwaite tests. Valuation peaks around age 27, with a 42%
    premium per SD of within-club playing time and a 17% domestic-citizenship discount.
  tags:
    - {label: "R / lme4", kind: r}
    - {label: "Cross-Classified MLM", kind: stat}
    - {label: "Crossed Random Effects", kind: stat}
    - {label: "Quarto", kind: quarto}
  badge: {text: "Moneyball FC · Cross-Classified Multilevel Model", color: "2d4a6e", order: 4}

